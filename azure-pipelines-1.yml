trigger: none

pool:
  name: axion-project

stages:
- stage: DockerBuildAndPush
  displayName: Docker Build and Push for Ingestion Service

  jobs:
  - job: DockerBuildAndPush
    displayName: Docker Build and Push for Ingestion Service

    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-sudsutar-svc-name'
        command: 'login'
    
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-sudsutar-svc-name'
        repository: 'DockerBuildAndPush_IngestionService'
        command: 'buildAndPush'
        Dockerfile: '**/axion-ingestion-service/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest


 
- stage: DeployToAKS
  displayName: Deploy Ingestion Service to AKS
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: Deploy Ingestion Service

      steps:

      - checkout: self

      - powershell: |
          Write-Host "Build Sources Directory:"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host "Repository files:"
          Get-ChildItem "$(Build.SourcesDirectory)" -Force

          Write-Host "Manifest directory:"
          Get-ChildItem "$(Build.SourcesDirectory)\Manifest" -Force
          
        displayName: 'Verify Repository and Manifest'
      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'kubernetesServiceConnection'
          kubernetesServiceConnection: 'kubernate-svc-name'
          namespace: 'default'
          manifests: |
            Manifest/ingestion-ingress.yaml
            Manifest/ingestion.yaml
            Manifest/ingestionservice.yaml
          containers: |
            acrsudarshan.azurecr.io/dockerbuildandpush_ingestionservice:latest