trigger: none

pool:
  name: axion-project

stages:
- stage: DockerBuildAndPush
  displayName: Docker Build and Push for Ingestion Service

  jobs:
  - job: DockerBuildAndPush
    displayName: Docker Build and Push for Ingestion Service

    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-sudsutar-svc-name'
        command: 'login'
    
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-sudsutar-svc-name'
        repository: 'DockerBuildAndPush_IngestionService'
        command: 'buildAndPush'
        Dockerfile: '**/axion-ingestion-service/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest


 
- stage: DeployToAKS
  displayName: Deploy Ingestion Service to AKS
  dependsOn: DockerBuildAndPush
  condition: succeeded()
  jobs:
    - job: Deploy
      displayName: Deploy Ingestion Service

      steps:

      - checkout: self
        clean: true
        fetchDepth: 0

      - powershell: |
          Write-Host "======================================"
          Write-Host "Build Sources Directory"
          Write-Host "======================================"
          Write-Host "$(Build.SourcesDirectory)"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Git Commit"
          Write-Host "======================================"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Ingestion YAML"
          Write-Host "======================================"
          Get-Content "$(Build.SourcesDirectory)\axion-ingestion-service\Manifest\ingestion.yaml"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Manifest directory"
          Write-Host "======================================"
          Get-ChildItem "$(Build.SourcesDirectory)\axion-ingestion-service\Manifest" -Force

        displayName: 'Verify Latest Git Checkout'
      - task: KubernetesManifest@1
        inputs:
          action: 'deploy'
          connectionType: 'kubernetesServiceConnection'
          kubernetesServiceConnection: 'kubernate-svc-name'
          manifests: '$(Build.SourcesDirectory)/axion-ingestion-service/Manifest/*'
          containers: |
            acrsudarshan.azurecr.io/dockerbuildandpush_ingestionservice:$(Build.BuildId)