trigger: none
pool: axion-project
stages:
- stage:
  displayName: DatabaseConnection 
  jobs:
  - job:
    displayName: creatingConnectionPostgre

    steps:
    - task: AzureCLI@3
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'axion-project-svc-name'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: 'psql "postgresudarshan.postgres.database.azure.com port=5432 dbname=axion-db user=sudarshandb sslmode=require"'
  