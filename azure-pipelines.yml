trigger:
- main

pool:
  name: sudarshancicd

steps:

# =========================================================
# 1. Check PostgreSQL Client
# =========================================================
- script: |
    echo "Checking PostgreSQL client..."
    where psql
    psql --version
  displayName: 'Check PostgreSQL Client'


# =========================================================
# 2. Test PostgreSQL Connection
# =========================================================
- script: |
    echo "Testing PostgreSQL connection..."

    psql ^
      "host=sudarshan-kubernate.postgres.database.azure.com port=5432 dbname=axion-db user=sudarshandb sslmode=require" ^
      -v ON_ERROR_STOP=1 ^
      -c "SELECT current_database(), current_user;"
  displayName: 'Test PostgreSQL Connection'
  env:
    PGPASSWORD: $(POSTGRES_PASSWORD)


# =========================================================
# 3. Check Schema Files
# =========================================================
- script: |
    echo "Checking schema files..."
    dir "$(Build.SourcesDirectory)\axion-database-schema"
  displayName: 'Check Schema Files'


# =========================================================
# 4. Apply Telemetry Schema
# =========================================================
- script: |
    echo "Applying 02-telemetry.sql..."

    psql ^
      "host=sudarshan-kubernate.postgres.database.azure.com port=5432 dbname=axion-db user=sudarshandb sslmode=require" ^
      -v ON_ERROR_STOP=1 ^
      -f "$(Build.SourcesDirectory)\axion-database-schema\02-telemetry.sql"
  displayName: 'Apply Telemetry Schema'
  env:
    PGPASSWORD: $(POSTGRES_PASSWORD)
