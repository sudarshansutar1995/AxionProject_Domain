trigger: none
pool: axion-project
stages:
- stage:
  displayName: DatabaseConnection 
  jobs:
  - job:
    displayName: creatingConnectionPostgre

    steps:
    - task: AzureCLI@3
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'axion-project-svc-name'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $env:PGPASSWORD="$(postgres_password)"
          
          psql -h "postgresudarshan.postgres.database.azure.com" -p 5432 -U "sudarshandb" -d "axiondb" -c "SELECT 1;"