
trigger:
- main

pool:
  name: sudarshancicd

steps:

# =========================================================
# 1. Check PostgreSQL Client
# =========================================================
- script: |
    echo "Checking PostgreSQL client..."
    where psql
    psql --version
  displayName: 'Check PostgreSQL Client'


# =========================================================
# 2. Test PostgreSQL Connection
# =========================================================
- script: |
    echo "Testing PostgreSQL connection..."

    psql ^
      "host=sudarshan-kubernate.postgres.database.azure.com port=5432 dbname=axion-db user=sudarshandb sslmode=require" ^
      -v ON_ERROR_STOP=1 ^
      -c "SELECT current_database(), current_user;"
  displayName: 'Test PostgreSQL Connection'
  env:
    PGPASSWORD: $(POSTGRES_PASSWORD)


